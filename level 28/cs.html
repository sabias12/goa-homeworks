<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>
        /* Block-level → Inline */
        div {
            display: inline;
        }

        p {
            display: inline;
        }

        /* Inline → Block-level */
        span {
            display: block;
        }

        a {
            display: block;
        }
    </style>
</head>

<body>

    <div>Div</div>
    <p>Paragraph</p>
    <h1>Heading</h1>

    
    <span>Span</span>
    <a href="#">Link</a>
    <strong>Strong</strong>



    <style>
        .text-block {
            border: 3px solid blue;
            color: darkblue;
            background-color: lightblue;
        }

        .button-block {
            border: 3px solid red;
            color: darkred;
            background-color: lightcoral;
        }
    </style>
</head>

<body>

    <div class="text-block">
        <h1>ჩემი ვებგვერდი</h1>
        <h2>სათაური</h2>
        <p>ეს არის ტექსტი</p>
        <p>ეს არის კიდევ ერთი ტექსტი</p>
    </div>

    <br>

    <div class="button-block">
        <button>ღილაკი 1</button>
        <button>ღილაკი 2</button>
        <button>ღილაკი 3</button>
    </div>

</body>
</html>
