<!DOCTYPE html>
<html>
<head>
    <title>RGB და HEX</title>

    <style>
        /* RGB - 3 ფერი: Red, Green, Blue */
        .rgb {
            color: rgb(255, 0, 0);
        }

        /* პირველი რიცხვი = წითელი
           მეორე = მწვანე
           მესამე = ლურჯი */

        /* heex - # + 6 სიმბოლო */
        .hex {
            color: #0000FF;
        }

        /* პირველი 2 = წითელი
           მეორე 2 = მწვანე
           ბოლო 2 = ლურჯი */
    </style>
</head>

<body>

    <h1 class="rgb">RGB ფერი</h1>
    <h1 class="hex">HEX ფერი</h1>




    <!DOCTYPE html>
<html>
<head>
    <title>ჩემი პატარა საიტი</title>

    <style>
        /* ყველა ტექსტს თავისი ფერი აქვს */
        h1 {
            color: #FF0000;
        }

        h2 {
            color: rgb(0, 0, 255);
        }

        h3 {
            color: #008000;
        }

        h4 {
            color: rgb(255, 165, 0);
        }

        h5 {
            color: #800080;
        }

        h6 {
            color: rgb(202, 145, 175);
        }

        p {
            color: #333333;
        }

        /* პატარა სტილიზაცია */
        div {
            border: 2px solid #000000;
            padding: 15px;
            background-color: #EEEEEE;
        }
    </style>
</head>

<body>

    <div>

        <h1>ჩემი ვებ საიტი</h1>
        <h2>პირველი ტექსტი</h2>
        <h3>მეორე ტექსტი</h3>
        <h4>მესამე ტექსტი</h4>
        <h5>მეოთხე ტექსტი</h5>
        <h6>მეხუთე ტექსტი</h6>

        <p>ეს არის პირველი პარაგრაფი.</p>
        <p>ეს არის მეორე პარაგრაფი.</p>
        <p>ეს არის მესამე პარაგრაფი.</p>
        <p>ეს არის მეოთხე პარაგრაფი.</p>

    </div>

</body>
</html>
</body>
</html>
