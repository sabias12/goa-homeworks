<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model Cards</title>

    <style>
        /* 1) პროფილის ბარათი */
        .profile-card {
            width: 300px;
            height: 400px;
            padding: 20px;
            border: 3px solid black;
            margin: 30px;
            box-sizing: border-box;
        }

        .profile-card img {
            width: 150px;
            height: 150px;
        }

        /* 2) პროდუქტის ბარათები */

        .product-card {
            width: 300px;
            padding: 20px;
            border: 5px solid black;
            margin: 30px;
        }

        .content-box {
            box-sizing: content-box;
        }

        .border-box {
            box-sizing: border-box;
        }

        .product-card img {
            width: 200px;
            height: 150px;
        }
    </style>
</head>

<body>

    <!-- პროფილის ბარათი -->
    <div class="profile-card">
        <img src="https://via.placeholder.com/150" alt="User Photo">

        <h2>Saba</h2>

        <p>
            I am a beginner web developer learning HTML and CSS.
        </p>

        <button>Contact</button>
    </div>


    <!-- პროდუქტის ბარათი - content-box -->
    <div class="product-card content-box">
        <img src="https://via.placeholder.com/200x150" alt="Product">

        <h2>Headphones</h2>

        <p>Price: $50</p>

        <p>High quality headphones with good sound.</p>

        <button>Buy Now</button>
    </div>


    <!-- პროდუქტის ბარათი - border-box -->
    <div class="product-card border-box">
        <img src="https://via.placeholder.com/200x150" alt="Product">

        <h2>Headphones</h2>

        <p>Price: $50</p>

        <p>High quality headphones with good sound.</p>

        <button>Buy Now</button>
    </div>

</body>
</html>
