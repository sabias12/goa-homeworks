<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <title>სარეგისტრაციო ფორმა</title>
</head>

<body>
    <h1>სარეგისტრაციო ფორმა</h1>
    <form> <label for="firstName">სახელი:</label> <input type="text" id="firstName" name="firstName"
            placeholder="შეიყვანე სახელი" required> <br><br> <label for="lastName">გვარი:</label> <input type="text"
            id="lastName" name="lastName" placeholder="შეიყვანე გვარი" required> <br><br> <label
            for="email">იმეილი:</label> <input type="email" id="email" name="email" placeholder="შეიყვანე იმეილი"
            required> <br><br> <label for="password">პაროლი:</label> <input type="password" id="password"
            name="password" placeholder="შეიყვანე პაროლი" required> <br><br> <label for="country">ქვეყანა:</label>
        <select id="country" name="country">
            <option value="georgia">საქართველო</option>
            <option value="usa">აშშ</option>
            <option value="germany">გერმანია</option>
            <option value="france">საფრანგეთი</option>
            <option value="uk">ინგლისი</option>
        </select> <br><br>

        <p>გენდერი:</p> <input type="radio" id="male" name="gender" value="male"> <label for="male">კაცი</label> <input
        
            type="radio" id="female" name="gender" value="female"> <label for="female">ქალი</label> <br><br> <button
            type="submit">რეგისტრაცია</button>
    </form>
</body>

</html>
