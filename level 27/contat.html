<!DOCTYPE html>

<html lang="ka"> <head> <meta charset="UTF-8"> <title>კონტაქტი</title> </head>

<body style="background-color: #fff3e0; color: #333333;">

<header style="background-color: #8b0000; color: white; text-align: center; padding: 20px;">
    <h1 style="font-size: 40px;">დაგვიკავშირდით</h1>
    <p style="font-size: 20px;">ჩვენ მოხარული ვიქნებით თქვენი დახმარებით</p>
</header>

<nav style="text-align: center; padding: 20px;">
    <a href="index.html" style="color: #8b0000; font-size: 18px;">მთავარი</a> |
    <a href="products.html" style="color: #8b0000; font-size: 18px;">მენიუ</a> |
    <a href="contact.html" style="color: #8b0000; font-size: 18px;">კონტაქტი</a>
</nav>

<main>

    <section style="padding: 30px; text-align: center;">
        <h2 style="color: #8b0000; font-size: 30px;">საკონტაქტო ფორმა</h2>

        <form>

            <label for="name" style="font-size: 18px;">სახელი:</label>
            <br>
            <input type="text" id="name" name="name"
                   placeholder="შეიყვანეთ სახელი"
                   style="font-size: 16px; padding: 8px;">
            <br><br>

            <label for="email" style="font-size: 18px;">ელფოსტა:</label>
            <br>
            <input type="email" id="email" name="email"
                   placeholder="შეიყვანეთ ელფოსტა"
                   style="font-size: 16px; padding: 8px;">
            <br><br>

            <label for="message" style="font-size: 18px;">შეტყობინება:</label>
            <br>
            <textarea id="message" name="message"
                      placeholder="დაწერეთ შეტყობინება"
                      style="font-size: 16px; padding: 8px;"
                      rows="5"
                      cols="30"></textarea>
            <br><br>

            <button type="submit"
                    style="background-color: #8b0000; color: white; font-size: 18px; padding: 10px 20px;">
                გაგზავნა
            </button>

        </form>
    </section>

    <section style="background-color: #ffe0b2; text-align: center; padding: 25px;">
        <h2 style="color: #8b0000; font-size: 25px;">ჩვენი ინფორმაცია</h2>

        <p style="font-size: 18px;">ტელეფონი: 555 123 456</p>
        <p style="font-size: 18px;">Email: delicious@example.com</p>
        <p style="font-size: 18px;">მისამართი: ბათუმი, საქართველო</p>
    </section>

</main>

<footer style="background-color: #8b0000; color: white; text-align: center; padding: 20px;">
    <p style="font-size: 16px;">© 2026 Delicious Restaurant</p>
</footer>

</body> </html>
